# ==============================================================================
# Crestix Probe — Random Forest Baseline Configuration (Person 4)
# Dataset: LarNO Urban Flood Dataset — UKEA 32x32 Subset
# ==============================================================================

random_seed: 42

dataset:
  name: "LarNO-UKEA-32x32"
  grid_rows: 32
  grid_cols: 32
  spatial_resolution_m: 8.0
  temporal_resolution_min: 5.0
  lead_steps: 6                    # +30 min ahead (6 * 5 min)
  num_synthetic_events: 10         # Used when --data-dir is empty/not supplied
  timesteps_per_event: 24          # 2 hours at 5-min cadence

splitting:
  strategy: "event_level"
  train_ratio: 0.60                # 6 train events
  val_ratio: 0.20                  # 2 val events (used ONLY for hyperparameter tuning)
  test_ratio: 0.20                 # 2 held-out test events (never used in train/tuning)

evaluation:
  flood_threshold_m: 0.03          # Common UKEA wet/flood threshold (3 cm)
  clip_negative_predictions: true  # Enforce h >= 0.0 m

model:
  search_grid:
    - n_estimators: 50
      max_depth: 12
      min_samples_leaf: 5
      max_features: "sqrt"
    - n_estimators: 100
      max_depth: 18
      min_samples_leaf: 3
      max_features: "sqrt"
    - n_estimators: 100
      max_depth: null
      min_samples_leaf: 2
      max_features: 0.5
  n_jobs: -1

outputs:
  model_path: "artifacts/random_forest_model.joblib"
  metrics_path: "outputs/evaluation_metrics.json"
  predictions_path: "outputs/test_predictions.csv"

